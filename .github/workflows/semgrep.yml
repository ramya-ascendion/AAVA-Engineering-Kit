# Semgrep reads the source for patterns that are often security bugs: SQL built
# from strings, an XML parser that follows outside entities, a workflow action
# pinned to a tag someone can move. It uses the free Community Edition and the
# `p/default` rules, with no Semgrep account.
#
# **A pull request fails only on findings it adds.** A tree that already has
# findings would otherwise fail every pull request until someone fixes all of
# them. `--baseline-commit` scans the base too and reports only what is new. The
# full list is the weekly report below.
#
# The image is pinned by digest for the same reason the Python gates install
# with `--require-hashes`: what runs on the runner is what this repo reviewed.
#
# Upstream code under `vendor/` is not scanned: it is imported pristine, the repo
# never edits it, and a finding there is not one a pull request here can fix. A
# project adds its own generated or imported directories to the `--exclude` list.

name: semgrep

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  new-findings:
    name: semgrep (new findings)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline scan checks out the base commit, so it needs history.
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The checkout is the pull request merged into its base, so the base
      # commit is exactly what the pull request changes are measured against.
      - name: no new findings
        run: >-
          semgrep scan --config p/default --metrics off --error
          --exclude vendor
          --baseline-commit "${{ github.event.pull_request.base.sha }}"

  full-report:
    name: semgrep (full report)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A report, not a gate: no `--error`, so the existing findings do not
      # turn `main` red. The SARIF file is an artifact for the same reason
      # Scorecard's is (`scorecard.yml`).
      - name: every finding in the tree
        run: semgrep scan --config p/default --metrics off --exclude vendor --sarif --output semgrep.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep
          path: semgrep.sarif
          retention-days: 30
