# OpenSSF Scorecard grades how this repo is run: branch protection, pinned
# dependencies, token permissions in workflows, and about a dozen more checks.
# It reads the repo; it builds nothing.
#
# **The report is a build artifact, not a code scanning alert.** Code scanning
# on a private repo needs the paid Code Security add-on, so the SARIF file is
# kept on the run instead. Download it from the run's summary page. For the
# same reason `publish_results` is off: publishing is for public repos only.
#
# It never fails a build. It is a report to read, not a gate.

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    # Mondays at 06:00 UTC, so a setting changed outside a commit still shows up.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30
