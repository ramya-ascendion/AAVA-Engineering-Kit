[pytest]
# Where tests live. `KIT_TEST_DIRS` in `.kit/config.env` names the same
# directories for the hooks; a test directory not listed there is not gated.
testpaths = tests
# Vendored skills are third-party and carry their own files.
norecursedirs = vendor .git node_modules

# Where a test file may import a shared helper from, named rather than inherited.
#
# Without `__init__.py` anywhere under `tests/`, pytest puts each test file's own
# directory on the path and nothing else. That is enough until a test moves, and
# it then fails in the confusing direction: the whole suite passes because some
# other file put that directory on the path first, while running the moved test
# on its own does not.
#
# **This list and pylint's `init-hook` in pyproject.toml have to agree.** They
# are two tools being told the same thing, and neither reads the other's file.
pythonpath = tests tests/unit tools

python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --verbose

# One line per marker. pytest reads each line here as a marker of its own, so
# a wrapped description registers its continuation lines as markers too.
# `tests/unit/test_pytest_markers.py` refuses that.
markers =
    live: needs a real environment (a running service, a real model); added by tests/conftest.py, never by hand, and run with --live.
